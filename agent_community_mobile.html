/* ============ 工具 ============ */
function esc(v) { return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function loadState(q, cap) { return q / cap; }
function loadColor(r) { return r >= 0.5 ? 'var(--brand)' : '#A9C4DA'; }
function loadText(r) {
  if (r >= 0.75) return { t:'拥挤', c:'text-warn', b:'border-warn' };
  if (r >= 0.4)  return { t:'偏挤', c:'text-brand', b:'border-brand' };
  return { t:'通畅', c:'text-mist', b:'border-line' };
}
function densityText(d) {
  if (d >= 30) return { t:'拥挤', c:'text-warn', b:'border-warn' };
  if (d >= 15) return { t:'偏挤', c:'text-brand', b:'border-brand' };
  return { t:'通畅', c:'text-mist', b:'border-line' };
}
function trailLine(kind) {
  const map = { solid:'none', dash:'5 3.5', dot:'1.6 2.8', wild:'7 3 1.6 3' };
  return `<svg width="22" height="8" aria-hidden="true"><line x1="0" y1="4" x2="22" y2="4" stroke="currentColor" stroke-width="1.6" stroke-dasharray="${map[kind] || 'none'}"/></svg>`;
}
function sectionHead(title, sub) {
  return `<div class="flex items-baseline justify-between gap-3 mb-3">
    <h2 class="text-[15px] font-semibold">${esc(title)}</h2>
    ${sub ? `<span class="text-[11px] text-mist">${esc(sub)}</span>` : ''}
  </div>`;
}
function liftRow(l, i, guestMode) {
  const r = loadState(l.queue, l.cap);
  const st = loadText(r);
  return `<div class="px-4 py-3">
    <div class="flex items-center gap-2.5">
      <span class="text-[12.5px] font-medium shrink-0">${esc(l.no)}</span>
      <span class="text-[10.5px] text-mist truncate">${esc(l.serve)}</span>
      <span class="ml-auto shrink-0 px-1.5 py-[2px] rounded-[4px] border text-[10px] ${st.b} ${st.c}">${st.t}</span>
    </div>
    <div class="mt-2 flex items-center gap-3">
      <div class="flex-1 h-[4px] rounded-full bg-brandsoft overflow-hidden">
        <div class="bar h-full rounded-full" id="bar-${i}" style="width:${Math.round(r*100)}%;background:${loadColor(r)}"></div>

      <span class="font-mono text-[12px] shrink-0 w-[74px] text-right"><span id="q-${i}">${l.queue}</span><span class="text-mist text-[10.5px]"> 人</span></span>

  </div>`;
}

      <li>长龙道 K1+200 摔倒事件已处置，巡逻队可回撤至 1 号索道下站待命。</li>
      <li>夜场 18:30 前完成 7 号索道试运行与照明巡检。</li>
    </ol>
  </div>

  <div class="mt-4 rounded-card bg-surface border border-line p-4">
    ${sectionHead('人员与车辆', '在岗情况')}
    <div class="grid grid-cols-2 gap-2.5">
      ${[['滑雪学校教练','312 人'],['索道运维','24 人'],['巡逻队','18 人'],['医疗值守','4 人']].map(([k,v])=>`<div class="px-3 py-2.5 bg-page rounded-chip"><div class="text-[10.5px] text-mist">${k}</div><div class="font-mono text-[12.5px] mt-1">${v}</div></div>`).join('')}
    </div>
  </div>`;
}

function opsEco() {
  const items = [
    ['绿电占比', OPS.greenPower + '%', '风电 + 光伏直供', OPS.greenPower],
    ['本季累计用电', OPS.kwh.toLocaleString() + ' kWh', '较上季 -9.4%', 74],
    ['造雪能耗', OPS.snowmakingKwh.toLocaleString() + ' kWh', '占比 43%', 43],
    ['索道能耗', OPS.liftKwh.toLocaleString() + ' kWh', '占比 26%', 26],
    ['累计减碳', OPS.co2Cut + ' t CO₂', '折算约 1,900 棵树', 61]

  return `
  <div class="rounded-card border border-line overflow-hidden" style="background:linear-gradient(180deg,#EAF6EF 0%,#FFFFFF 62%)">
    <div class="p-4">
      <div class="flex items-center gap-2">
        <span class="text-eco w-4 h-4 inline-block">${ICON.recycle}</span>
        <span class="text-[12px] text-eco font-medium">雪场低碳运营</span>
      </div>
      <div class="mt-2 flex items-baseline gap-2">
        <span class="font-mono text-[30px] leading-none font-semibold">${OPS.greenPower}%</span>
        <span class="text-[12px] text-mist">绿电占比</span>
        <span class="ml-auto text-[11px] text-mist">本季减碳 <span class="font-mono text-eco">${OPS.co2Cut}</span> t</span>
      </div>
      <div class="mt-3.5 h-[5px] rounded-full bg-brandsoft overflow-hidden">
        <div class="bar h-full rounded-full bg-eco" style="width:${OPS.greenPower}%"></div>
      </div>
    </div>
    <div class="px-4 py-2.5 border-t border-line text-[10.5px] text-mist leading-relaxed">
      万龙滑雪场持续推进造雪与索道能效改造，并引导雪友通过太子城站接驳替代自驾。
    </div>
  </div>

  <div class="mt-4 rounded-card bg-surface border border-line p-4">
    ${sectionHead('能耗结构', '本雪季累计')}
    <div class="space-y-3.5">${items.map(([k,v,d,w])=>`<div>
      <div class="flex items-center gap-2 text-[11.5px]">
        <span class="shrink-0">${k}</span>
        <span class="ml-auto font-mono shrink-0">${v}</span>
      </div>
      <div class="mt-1.5 h-[4px] rounded-full bg-brandsoft overflow-hidden">
        <div class="bar h-full rounded-full bg-eco" style="width:${w}%"></div>
      </div>
      <div class="mt-1 text-[10.5px] text-mist">${d}</div>

  <div class="mt-4 rounded-card bg-surface border border-line p-4">

    <div class="grid grid-cols-3 gap-px bg-line rounded-chip overflow-hidden">
      ${[['滑行里程','12,846 km'],['兑换积分','86,420'],['减碳量','2.31 t']].map(([k,v])=>`<div class="bg-surface px-2.5 py-3"><div class="text-[10.5px] text-mist">${k}</div><div class="font-mono text-[12.5px] mt-1.5">${v}</div></div>`).join('')}
    </div>

/* ============ 视图注册与导航 ============ */
const VIEWS = {
  guest: [
    { key:'snow',    label:'雪况', icon:'snow',    render:guestSnow },
    { key:'trails',  label:'雪道', icon:'trail',   render:guestTrails },
    { key:'service', label:'服务', icon:'service', render:guestService },
    { key:'eco',     label:'低碳', icon:'eco',     render:guestEco },
    { key:'me',      label:'我的', icon:'me',      render:guestMe }
  ],
  ops: [
    { key:'dash',     label:'总览', icon:'dash',    render:opsDash },
    { key:'flow',     label:'客流', icon:'flow',    render:opsFlow },
    { key:'safety',   label:'安防', icon:'shield',  render:opsSafety },
    { key:'dispatch', label:'调度', icon:'gear',    render:opsDispatch },
    { key:'eco',      label:'低碳', icon:'recycle', render:opsEco }
  ]
};

const state = { role: 'guest', tab: { guest: 'snow', ops: 'dash' }, filters: { grade: '全部', cat: '全部' } };

function currentViews() { return VIEWS[state.role]; }
function currentKey() { return state.tab[state.role]; }

function renderTabbar() {
  const bar = document.getElementById('tabbar');
  const list = currentViews();
  bar.innerHTML = list.map(v => {
    const on = v.key === currentKey();
    return `<button class="tab focusable py-2.5 flex flex-col items-center gap-1 ${on?'text-brand':'text-mist'}" data-key="${v.key}" aria-current="${on?'page':'false'}">
      <span class="w-[21px] h-[21px] block">${ICON[v.icon]}</span>
      <span class="text-[10px] leading-none">${v.label}</span>
    </button>`;
  }).join('');
}

function renderViews() {
  const wrap = document.getElementById('views');
  const list = currentViews();
  wrap.innerHTML = list.map(v => `<section class="view${v.key===currentKey()?' active':''}" data-view="${v.key}">${v.render()}</section>`).join('');
}

function renderAll() {
  document.querySelectorAll('.role-btn').forEach(b => {
    const on = b.dataset.role === state.role;
    b.classList.toggle('bg-surface', on);
    b.classList.toggle('text-brand', on);
    b.classList.toggle('font-semibold', on);
    b.classList.toggle('shadow-sm', on);
    b.classList.toggle('text-mist', !on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  renderTabbar();
  renderViews();
}

function switchTab(key) {
  if (key === currentKey()) return;
  state.tab[state.role] = key;
  const wrap = document.getElementById('views');
  wrap.querySelectorAll('.view').forEach(s => s.classList.toggle('active', s.dataset.view === key));
  renderTabbar();
}

function switchRole(role) {
  if (role === state.role) return;
  state.role = role;
  state.filters = { grade: '全部', cat: '全部' };
  renderAll();
  document.getElementById('views').scrollIntoView({ block: 'start' });
}

/* ============ 交互 ============ */
document.addEventListener('click', function (ev) {
  const roleBtn = ev.target.closest('.role-btn');
  if (roleBtn) { switchRole(roleBtn.dataset.role); return; }

  const tab = ev.target.closest('.tab');
  if (tab) { switchTab(tab.dataset.key); return; }

  const more = ev.target.closest('.more');
  if (more) {
    const box = more.parentElement.querySelector('.detail');
    const open = !box.classList.contains('hidden');
    box.classList.toggle('hidden', open);
    more.textContent = open ? '展开详情' : '收起详情';
    return;
  }

  const grade = ev.target.closest('.grade-btn');
  if (grade) {
    state.filters.grade = grade.dataset.grade;
    document.querySelectorAll('.grade-btn').forEach(b => {
      const on = b.dataset.grade === state.filters.grade;
      b.classList.toggle('bg-brand', on);
      b.classList.toggle('text-white', on);
      b.classList.toggle('border-brand', on);
      b.classList.toggle('text-mist', !on);
      b.classList.toggle('bg-surface', !on);
      b.classList.toggle('border-line', !on);
    });
    document.querySelectorAll('#trail-list [data-grade]').forEach(card => {
      card.style.display = (state.filters.grade === '全部' || card.dataset.grade === state.filters.grade) ? '' : 'none';
    });
    return;
  }

  const cat = ev.target.closest('.cat-btn');
  if (cat) {
    state.filters.cat = cat.dataset.cat;
    document.querySelectorAll('.cat-btn').forEach(b => {
      const on = b.dataset.cat === state.filters.cat;
      b.classList.toggle('bg-brand', on);
      b.classList.toggle('text-white', on);
      b.classList.toggle('border-brand', on);
      b.classList.toggle('text-mist', !on);
      b.classList.toggle('bg-surface', !on);
      b.classList.toggle('border-line', !on);
    });
    document.querySelectorAll('#service-list [data-cat]').forEach(card => {
      card.style.display = (state.filters.cat === '全部' || card.dataset.cat === state.filters.cat) ? '' : 'none';
    });
    return;
  }

  const redeem = ev.target.closest('.redeem');
  if (redeem) {
    const cost = Number(redeem.dataset.cost);
    if (ECO.points < cost) { toast('碳积分不足，再滑 ' + Math.ceil((cost - ECO.points) / ECO.kmToPoint) + ' km 即可兑换'); return; }
    ECO.points -= cost;
    toast('已兑换「' + redeem.dataset.name + '」，剩余 ' + ECO.points + ' 分');
    renderViews();
    return;
  }

  const sos = ev.target.closest('.sos');
  if (sos) { toast('已发送求助信号，雪地巡逻队正在响应'); return; }
});

let toastTimer = null;
function toast(msg) {
  const box = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  box.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.add('hide'), 2200);
}

/* 低碳积分与进度同步 */
function syncEco() {
  const pts = document.getElementById('eco-points');
  const bar = document.getElementById('eco-bar');
  const gap = document.getElementById('eco-gap');
  const pct = document.getElementById('eco-pct');
  if (pts) pts.textContent = ECO.points;
  const MAX = 420;
  const p = Math.min(100, Math.round(ECO.points / MAX * 100));
  if (bar) bar.style.width = Math.max(0, p) + '%';
  if (gap) gap.textContent = Math.max(0, MAX - ECO.points);
  if (pct) pct.textContent = p + '%';
}

/* 时钟 */
function tickClock() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const el = document.getElementById('clock');
  if (el) el.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* 模拟实时刷新：索道排队 + 雪道密度 */
function jitter(v, step, min, max) {
  const n = v + Math.round((Math.random() * 2 - 1) * step);
  return Math.max(min, Math.min(max, n));
}

function refreshLive() {
  LIFTS.forEach((l, i) => {
    l.queue = jitter(l.queue, 6, 0, l.cap);
    l.q30 = jitter(l.q30, 5, 0, l.cap);
    const r = loadState(l.queue, l.cap);
    const bar = document.getElementById('bar-' + i);
    const q = document.getElementById('q-' + i);
    const q30 = document.getElementById('q30-' + i);
    if (bar) { bar.style.width = Math.round(r * 100) + '%'; bar.style.background = loadColor(r); }
    if (q) q.textContent = l.queue;
    if (q30) q30.textContent = l.q30;
  });
  TRAILS.forEach((t, i) => {
    if (!t.open) return;
    t.density = jitter(t.density, 3, 0, 40);
    t.d30 = jitter(t.d30, 3, 0, 40);
    const tb = document.getElementById('tbar-' + i);
    const td = document.getElementById('td-' + i);
    const td30 = document.getElementById('td30-' + i);
    if (tb) {
      tb.style.width = Math.min(100, Math.round(t.density / 40 * 100)) + '%';
      tb.style.background = t.density >= 30 ? 'var(--warn)' : 'var(--brand)';
    }
    if (td) td.textContent = t.density;
    if (td30) td30.textContent = t.d30;
  });
  if (state.role === 'ops' && currentKey() === 'flow') {
    document.querySelectorAll('#views [id^="obar-"]').forEach((b, i) => {
      const l = LIFTS[i]; if (!l) return;
      const r = loadState(l.queue, l.cap);
      b.style.width = Math.round(r * 100) + '%';
      b.style.background = loadColor(r);
    });
  }
}

/* 模拟事件流推送 */
const RANDOM_EVENTS = [
  { type:'摔倒 · 侧向失控', risk:'中', loc:'金龙道下段', cam:'CAM-02', act:'巡逻队已出动' },
  { type:'雪道拥堵', risk:'中', loc:'长龙道出口段', cam:'CAM-04', act:'已推送减速广播' },
  { type:'雪具遗落', risk:'低', loc:'1 号索道下站', cam:'CAM-01', act:'已广播招领' },
  { type:'越线进入野雪', risk:'中', loc:'野雪区入口西侧', cam:'CAM-11', act:'巡逻队前往劝返' },
  { type:'静止超时', risk:'低', loc:'玉龙道下段', cam:'CAM-08', act:'已核实无碍' }
];

function pushEvent() {
  const list = document.getElementById('event-list');
  if (!list) return;
  const e = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
  const div = document.createElement('div');
  div.className = 'feed-item feed-enter';
  div.innerHTML = eventRow(e);
  list.insertBefore(div, list.firstChild);
  while (list.children.length > 6) list.removeChild(list.lastChild);
  requestAnimationFrame(() => div.classList.remove('feed-enter'));
}

/* 初始化 */
renderAll();
tickClock();
syncEco();
setInterval(tickClock, 1000);
setInterval(refreshLive, 6000);
setInterval(() => { if (state.role === 'ops' && currentKey() === 'safety') pushEvent(); }, 9000);
</script>
